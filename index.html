<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OO社區115年度會議日期填填看</title>
<style>
:root{font-family:"Microsoft JhengHei",Arial,sans-serif;color:#243447;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0;padding:24px 14px}
main{max-width:1000px;margin:auto;background:white;border:1px solid #dce4ec;border-radius:18px;padding:24px;box-shadow:0 8px 28px #1b355015}
header{text-align:center;margin-bottom:22px}h1{color:#237eae;margin:8px 0;font-size:clamp(24px,4vw,34px)}
.sub{color:#65758b}.hint{background:#eef6fb;padding:12px 16px;border-radius:12px;line-height:1.8;margin:16px 0}
.progressline{height:9px;background:#e8edf2;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2689bd;transition:width .2s}
.progress{display:flex;justify-content:space-between;margin:18px 0 8px;font-weight:700}
.gridhead,.game-row{display:grid;grid-template-columns:minmax(230px,2.2fr) repeat(5,minmax(105px,1fr));gap:10px;align-items:center}
.gridhead{font-size:13px;color:#56677b;font-weight:700;padding:10px 12px}
.game-row{border:1px solid #dfe6ed;border-radius:12px;padding:13px;margin:9px 0}
.meeting{font-weight:700;line-height:1.6}.num{display:block;font-size:12px;color:#78899b;margin-bottom:4px}
select{width:100%;padding:12px 8px;border:1px solid #cbd6e0;border-radius:9px;background:white;font-size:15px;color:#243447}
select:focus{outline:2px solid #86c5e5;border-color:#2689bd}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;flex:1}
.primary{background:#218653;color:white}.secondary{background:#edf1f5;color:#34465a}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-weight:700;margin-top:8px;font-size:14px}.correct{color:#16834b}.wrong{color:#c33e3e}
.answer{font-size:13px;color:#16834b;margin-top:7px;line-height:1.5}
.result{margin-top:18px;padding:18px;border-radius:12px;background:#f0f4f7;text-align:center}
.result h2{margin:0 0 6px}.small{font-size:12px;color:#718096;text-align:center;margin-top:14px}
@media(max-width:680px){body{padding:10px 7px}main{padding:14px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.gridhead,.game-row{min-width:900px;grid-template-columns:minmax(230px,2.2fr) repeat(5,minmax(105px,1fr));gap:7px}.gridhead{padding:6px 8px;font-size:12px}.game-row{padding:9px 8px}.meeting{font-size:13px}select{font-size:13px;padding:10px 5px}.num{font-size:10px}}
</style>
</head>
<body>
<main>
<header>
<div style="color:#2689bd;font-weight:700">互動闖關遊戲</div>
<h1>會議日期連連看</h1>
<div><b>OO社區115年度區分所有權人會議</b></div>
<p class="sub">會議名稱固定順序，請完成五欄日期配對</p>
</header>
<div class="hint"><b>遊戲規則</b><br>① 五個日期欄位各自獨立管理選項。<br>② 選取日期後，同欄其他列會自動移除該日期；更改或清空選擇時，日期會自動恢復。<br>③ 六組全部完成後，按「確認答案」查看答對與答錯。</div>
<div class="progress"><span>作答進度</span><span id="progressText">0 / 6 組</span></div>
<div class="progressline"><div class="bar" id="bar"></div></div>
<div class="table-wrap"><div class="gridhead"><div>會議名稱</div><div>日期①</div><div>日期②</div><div>日期③</div><div>日期④</div><div>日期⑤</div></div>
<div id="rows"></div></div>
<div class="actions">
<button class="primary" id="check" disabled>確認全部答案</button>
<button class="secondary" id="reset">全部清除／重新挑戰</button>
</div>
<div id="result"></div>
<div class="small">每個日期欄位限使用一次；五個日期均須依序符合該會議名稱的標準答案。</div>
</main>
<script>
const data=[
["OO社區115年度區分所有權人會議",["1月10日","1月10日","6月18日","2月10日","2月10日"]],
["OO社區115年度區分所有權人會議「重新召集」",["2月10日","2月10日","7月10日","4月8日","4月8日"]],
["OO社區115年度臨時區分所有權人會議",["4月8日","6月18日","1月10日","1月10日","1月10日"]],
["OO社區115年度第二次臨時區分所有權人會議",["6月18日","7月10日","2月10日","7月10日","6月18日"]],
["OO社區115年度第二次臨時區分所有權人會議「重新召集」",["7月10日","11月11日","4月8日","11月11日","7月10日"]],
["OO社區115年度第二次區分所有權人會議",["11月11日","4月8日","11月11日","6月18日","11月11日"]]
];
const pools=Array.from({length:5},()=>["1月10日","2月10日","4月8日","6月18日","7月10日","11月11日"]);
let answers=data.map(()=>["","","","",""]),checked=false;
const rowsEl=document.getElementById("rows");
function render(){
 rowsEl.innerHTML="";
 data.forEach((item,i)=>{
  const row=document.createElement("section");row.className="game-row";
  const name=document.createElement("div");name.className="meeting";
  const num=document.createElement("span");num.className="num";num.textContent=`第 ${i+1} 組`;
  name.append(num,document.createTextNode(item[0]));row.append(name);
  for(let j=0;j<5;j++){
   const sel=document.createElement("select");sel.setAttribute("aria-label",`第${i+1}組日期${j+1}`);
   const blank=document.createElement("option");blank.value="";blank.textContent="選日期";sel.append(blank);
   const used=answers.map((a,k)=>k!==i?a[j]:"");
   pools[j].forEach(v=>{
    if(!used.includes(v)||answers[i][j]===v){
     const op=document.createElement("option");op.value=v;op.textContent=v;sel.append(op);
    }
   });
   sel.value=answers[i][j];sel.disabled=checked;
   sel.addEventListener("change",()=>{answers[i][j]=sel.value;render();});
   row.append(sel);
  }
  if(checked){
   const ok=item[1].every((v,j)=>answers[i][j]===v);
   const status=document.createElement("div");status.className="status "+(ok?"correct":"wrong");
   status.style.gridColumn="1 / -1";status.textContent=ok?"✓ 答對！":"✕ 答錯！";
   row.append(status);
   if(!ok){const ans=document.createElement("div");ans.className="answer";ans.style.gridColumn="1 / -1";ans.textContent="正確答案："+item[1].join("、");row.append(ans);}
  }
  rowsEl.append(row);
 });
 const count=answers.filter(a=>a.every(Boolean)).length;
 document.getElementById("progressText").textContent=`${count} / 6 組`;
 document.getElementById("bar").style.width=(count/6*100)+"%";
 document.getElementById("check").disabled=checked||count!==6;
 if(checked){
  const score=data.filter((r,i)=>r[1].every((v,j)=>answers[i][j]===v)).length;
  document.getElementById("result").innerHTML=`<div class="result"><h2>${score===6?"🎉 恭喜！全部答對！":"作答完成"}</h2><div>答對 <b>${score}</b> / 6 組　｜　答錯 <b>${6-score}</b> 組</div></div>`;
 }else document.getElementById("result").innerHTML="";
}
document.getElementById("check").addEventListener("click",()=>{if(answers.every(a=>a.every(Boolean))){checked=true;render();}});
document.getElementById("reset").addEventListener("click",()=>{answers=data.map(()=>["","","","",""]);checked=false;render();});
render();
</script>
</body>
</html>
